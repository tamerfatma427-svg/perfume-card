<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style2.css">
    <title>Perfume Card</title>
</head>

<body>

    <div class="card">

        <div class="image">
            <img class="bimage" src="image-product-desktop.jpg" alt="Perfume Image">
        </div>

        <div class="content">

            <p class="category">PERFUME</p>

            <h1>
                Gabrielle <br>
                Essence Eau <br>
                De Parfum
            </h1>

            <p class="description">
                A floral, solar and voluptuous <br>
                interpretation composed by <br>
                Olivier Polge, Perfumer-Creator <br>
                for the House of CHANEL.
            </p>

            <div class="price">
                <span class="new-price">$149.99</span>
                <span class="old-price">$169.99</span>
            </div>
            <button>
                🛒 Add to Cart
            </button>
        </div>
    </div>
</body>
</html>
